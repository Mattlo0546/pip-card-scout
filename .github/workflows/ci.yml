name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify app and extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build API
        run: npm run build

      - name: Package extension
        run: npm run extension:package

      - name: Verify reproducible archive
        shell: bash
        run: |
          first_checksum="$(sha256sum dist/*.zip)"
          npm run extension:package
          second_checksum="$(sha256sum dist/*.zip)"
          test "$first_checksum" = "$second_checksum"
          (cd dist && sha256sum --check *.sha256)

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: pip-card-scout-extension
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
